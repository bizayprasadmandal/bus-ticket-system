name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "CI passed. Ready to deploy."
          echo ""
          echo "Render: render.yaml blueprint in repo root"
          echo "  - In Render: New + -> Blueprint -> connect this repo"
          echo "  - Or point each service at this repo (API=Docker, web=static frontend/)"
          echo "  - Set sync:false env vars after first deploy (DB_*, BASE_URL, FRONTEND_URL, VITE_*)"
          echo "  - Seed once: Render shell -> node seed.js"
