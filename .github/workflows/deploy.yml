name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "CI passed. Ready to deploy."
          echo "Configure your deployment target in this file."
          echo ""
          echo "Options:"
          echo "  - Docker: docker-compose up -d --build"
          echo "  - Railway: railway up"
          echo "  - Render: auto-deploy on push to main"
          echo "  - AWS ECS: aws ecs update-service"
